name: Gaswise Auto Scraper

on:
  schedule:
    # 分钟设为 30，小时设为 12，15, 18, 21 (对应多伦多 8:30，11:30, 14:30, 17:30)
    - cron: '30 12,15,18,21 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # 强制开启 Node.js 24 模式以消除警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 直接在虚拟机系统层面锁定多伦多时间
      TZ: "America/Toronto"

    steps:
      # 更新到 v4 版本以支持 Node.js 24
      - name: Checkout code
        uses: actions/checkout@v4

      # 更新到 v5 版本以支持 Node.js 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install beautifulsoup4
          pip install lxml
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        # 运行主程序
        run: python scraper.py

      - name: Commit and Push CSV changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.csv scraper.log
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update prices [$(date)]"
            git push
          else
            echo "No changes to commit"
          fi
