name: Gaswise Auto Scraper

on:
  schedule:
    # 定时任务 (多伦多下午 1:00 = UTC 17:00; 下午 5:00 = UTC 21:00)
    - cron: '0 17,21 * * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装 scraper.py 所需的全部依赖
          pip install requests beautifulsoup4 playwright
          # 安装 Playwright 的 Chromium 浏览器内核
          playwright install chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push CSV changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 仅跟踪数据变动
          git add *.csv scraper.log
          # 检查是否有变动，防止空提交报错
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update prices [$(date)]"
            git push
          else
            echo "No changes to commit"
          fi